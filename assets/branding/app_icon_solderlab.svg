<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="clean_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#52738D" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="clean_body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7294B0"/>
      <stop offset="50%" stop-color="#52738D"/>
      <stop offset="100%" stop-color="#3A556B"/>
    </linearGradient>
    <radialGradient id="clean_glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#CBE2F4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#52738D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Warm Vanilla Canvas (iOS Standard Squircle r=115) -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="#FAF8EE" stroke="#A8CCE8" stroke-width="2.5"/>

  <!-- Soft Ground Contact Shadow -->
  <ellipse cx="256" cy="428" rx="110" ry="18" fill="#52738D" opacity="0.16"/>

  <!-- Cute Boots -->
  <path d="M 205 398 C 190 416, 175 432, 200 436 C 225 436, 230 416, 222 398 Z" fill="#3A556B"/>
  <path d="M 307 398 C 292 416, 282 436, 312 436 C 337 436, 322 416, 307 398 Z" fill="#3A556B"/>

  <!-- Main Hero Solder Droplet Body (Soldy) -->
  <path d="M 256 82 C 148 220, 105 278, 105 348 C 105 428, 172 450, 256 450 C 340 450, 407 428, 407 348 C 407 278, 364 220, 256 82 Z" fill="url(#clean_body)" filter="url(#clean_shadow)"/>

  <!-- 3D Specular Highlight Curve on Body -->
  <path d="M 256 110 C 185 220, 145 278, 142 342 C 140 278, 180 214, 256 110 Z" fill="#FFFFFF" opacity="0.36"/>

  <!-- Technician Safety Goggles on Forehead -->
  <g id="goggles">
    <path d="M 148 190 C 190 170, 322 170, 364 190" fill="none" stroke="#3A556B" stroke-width="13" stroke-linecap="round"/>
    <rect x="180" y="162" width="66" height="50" rx="16" fill="#CBE2F4" stroke="#3A556B" stroke-width="7"/>
    <ellipse cx="204" cy="180" rx="13" ry="6" fill="#FFFFFF" opacity="0.85"/>
    <rect x="266" y="162" width="66" height="50" rx="16" fill="#CBE2F4" stroke="#3A556B" stroke-width="7"/>
    <ellipse cx="290" cy="180" rx="13" ry="6" fill="#FFFFFF" opacity="0.85"/>
    <rect x="244" y="177" width="24" height="11" rx="4" fill="#3A556B"/>
  </g>

  <!-- Big Encouraging Kawaii Eyes -->
  <ellipse cx="214" cy="294" rx="14" ry="24" fill="#243746"/>
  <circle cx="209" cy="284" r="7.5" fill="#FFFFFF"/>
  <circle cx="217" cy="305" r="3.5" fill="#FFFFFF"/>

  <ellipse cx="298" cy="294" rx="14" ry="24" fill="#243746"/>
  <circle cx="293" cy="284" r="7.5" fill="#FFFFFF"/>
  <circle cx="301" cy="305" r="3.5" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="184" cy="324" rx="17" ry="10" fill="#E8A598" opacity="0.6"/>
  <ellipse cx="328" cy="324" rx="17" ry="10" fill="#E8A598" opacity="0.6"/>

  <!-- Sweet Confident Smile -->
  <path d="M 240 324 Q 256 344 272 324" fill="none" stroke="#243746" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Solder Wire Spool on Left Hip -->
  <g id="spool" transform="translate(108, 355)">
    <rect x="0" y="0" width="28" height="40" rx="6" fill="#3A556B"/>
    <rect x="5" y="6" width="18" height="28" rx="3" fill="#CBE2F4"/>
    <line x1="5" y1="12" x2="23" y2="12" stroke="#52738D" stroke-width="2.5"/>
    <line x1="5" y1="18" x2="23" y2="18" stroke="#52738D" stroke-width="2.5"/>
    <line x1="5" y1="24" x2="23" y2="24" stroke="#52738D" stroke-width="2.5"/>
    <path d="M 23 15 C 42 9, 58 23, 72 19" fill="none" stroke="#CBE2F4" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Left Arm Guiding Wire -->
  <path d="M 128 318 C 108 338, 138 372, 172 369" fill="none" stroke="#3A556B" stroke-width="15" stroke-linecap="round"/>
  <circle cx="174" cy="369" r="9.5" fill="#3A556B"/>

  <!-- Right Arm Holding Soldering Iron -->
  <path d="M 378 322 C 402 338, 418 372, 384 396" fill="none" stroke="#3A556B" stroke-width="15" stroke-linecap="round"/>
  <circle cx="380" cy="398" r="10.5" fill="#3A556B"/>

  <!-- Cute Soldering Iron Tool -->
  <g id="iron" transform="translate(365, 302) rotate(32)">
    <circle cx="0" cy="170" r="30" fill="url(#clean_glint)"/>
    <rect x="-13" y="0" width="26" height="92" rx="10" fill="#3A556B"/>
    <rect x="-15" y="19" width="30" height="11" rx="3" fill="#CBE2F4"/>
    <rect x="-15" y="53" width="30" height="11" rx="3" fill="#CBE2F4"/>
    <rect x="-7" y="92" width="14" height="48" rx="3" fill="#E2E8F0"/>
    <polygon points="0,170 -9,138 9,138" fill="#CBE2F4" stroke="#52738D" stroke-width="1.5"/>
    <circle cx="0" cy="168" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- 3 Clean Floating Sparkles (✦) -->
  <g fill="#CBE2F4">
    <path d="M 425 415 Q 425 395 435 395 Q 425 395 425 375 Q 425 395 415 395 Q 425 395 425 415 Z"/>
    <circle cx="425" cy="395" r="3" fill="#FFFFFF"/>
    <path d="M 370 115 Q 370 103 376 103 Q 370 103 370 91 Q 370 103 364 103 Q 370 103 370 115 Z"/>
    <path d="M 80 230 Q 80 220 85 220 Q 80 220 80 210 Q 80 220 75 220 Q 80 220 80 230 Z"/>
  </g>
</svg>
