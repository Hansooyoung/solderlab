<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Ambient Icon Drop Shadow -->
    <filter id="iconSoftShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#52738D" flood-opacity="0.18"/>
    </filter>

    <!-- Volumetric Mascot Drop Shadow -->
    <filter id="mascotVolumetricShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#243746" flood-opacity="0.22"/>
    </filter>

    <!-- Glass Refraction Filter for Goggles -->
    <filter id="glassSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.6"/>
    </filter>

    <!-- 1. Rich Solder Body Radial/Linear Volumetric Gradient -->
    <radialGradient id="body3D" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#99BDD8"/>
      <stop offset="25%" stop-color="#7294B0"/>
      <stop offset="65%" stop-color="#52738D"/>
      <stop offset="88%" stop-color="#3B5870"/>
      <stop offset="100%" stop-color="#283F52"/>
    </radialGradient>

    <!-- 2. Rim Light Gradient (Subtle bounce from Soft Sky floor) -->
    <linearGradient id="rimLightGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#CBE2F4" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#CBE2F4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#CBE2F4" stop-opacity="0"/>
    </linearGradient>

    <!-- 3. Specular Metallic Sheen Sweep Gradient -->
    <linearGradient id="specularSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 4. Goggle Frame Metallic Bevel -->
    <linearGradient id="goggleFrameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A657D"/>
      <stop offset="50%" stop-color="#334A5E"/>
      <stop offset="100%" stop-color="#213342"/>
    </linearGradient>

    <!-- 5. Glass Lens Blue Refraction Gradient -->
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF5FC"/>
      <stop offset="40%" stop-color="#D4EAF8"/>
      <stop offset="100%" stop-color="#B2D8F2"/>
    </linearGradient>

    <!-- 6. Stainless Steel Barrel Shading on Iron -->
    <linearGradient id="metalShaftGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- 7. Ceramic Tip Glow Aura -->
    <radialGradient id="tipPulsingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#CBE2F4" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#52738D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#52738D" stop-opacity="0"/>
    </radialGradient>

    <!-- 8. Subtle Pillowy Inner Bevel for Canvas -->
    <linearGradient id="canvasBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8E2D0" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Clip Path for Canvas -->
    <clipPath id="squircleBevelClip">
      <rect x="16" y="16" width="480" height="480" rx="116"/>
    </clipPath>
  </defs>

  <!-- ================================================================= -->
  <!-- 1. BASE CANVAS (Tactile Pillowy Warm Vanilla Squircle)            -->
  <!-- ================================================================= -->
  <!-- Base Shadow & Fill -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#FAF8EE" filter="url(#iconSoftShadow)"/>
  
  <!-- Subtle Tactile Inner Glow & Bevel Ring -->
  <g clip-path="url(#squircleBevelClip)">
    <!-- Top-left soft highlight aura -->
    <ellipse cx="140" cy="80" rx="220" ry="140" fill="#FFFFFF" opacity="0.45"/>
    <!-- Bottom subtle warm rim -->
    <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#canvasBevel)" stroke-width="4"/>
  </g>
  <!-- Clean outer sky border -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#A8CCE8" stroke-width="2.2"/>

  <!-- ================================================================= -->
  <!-- 2. STAGE & TACTILE ENVIRONMENT ELEMENTS                           -->
  <!-- ================================================================= -->
  <!-- Subtle PCB Copper Pad Base beneath Soldy (Adds Electronics Context) -->
  <g id="pcb_stage_pad" opacity="0.65">
    <!-- Copper Annular Ring with Matte Solder Mask -->
    <ellipse cx="256" cy="432" rx="145" ry="32" fill="#EAE5D2"/>
    <ellipse cx="256" cy="432" rx="145" ry="32" fill="none" stroke="#D1CBB5" stroke-width="2"/>
    <ellipse cx="256" cy="432" rx="125" ry="26" fill="none" stroke="#CBE2F4" stroke-width="2" stroke-dasharray="8,6"/>
    <!-- 4 Radial Circuit Trace Lines -->
    <line x1="110" y1="432" x2="80" y2="432" stroke="#CBE2F4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="76" cy="432" r="4.5" fill="#CBE2F4"/>
    <line x1="402" y1="432" x2="432" y2="432" stroke="#CBE2F4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="436" cy="432" r="4.5" fill="#CBE2F4"/>
  </g>

  <!-- Multi-Layer Ground Contact Shadow -->
  <!-- Diffuse soft shadow -->
  <ellipse cx="256" cy="434" rx="115" ry="22" fill="#243746" opacity="0.12"/>
  <!-- Occlusion dark core shadow -->
  <ellipse cx="256" cy="436" rx="75" ry="12" fill="#15222E" opacity="0.18"/>

  <!-- ================================================================= -->
  <!-- 3. CUTE TECHNICIAN BOOTS WITH 3D SHADING                          -->
  <!-- ================================================================= -->
  <!-- Left Boot -->
  <g id="left_boot">
    <path d="M 205 398 C 188 418, 172 434, 198 438 C 224 438, 230 418, 222 398 Z" fill="#283F52"/>
    <path d="M 194 424 C 186 432, 182 436, 198 437 C 214 437, 218 432, 218 424 Z" fill="#3D5A73" opacity="0.5"/>
    <ellipse cx="204" cy="430" rx="12" ry="4" fill="#52738D" opacity="0.6"/>
  </g>
  <!-- Right Boot -->
  <g id="right_boot">
    <path d="M 307 398 C 290 418, 280 438, 310 438 C 336 438, 322 418, 307 398 Z" fill="#283F52"/>
    <path d="M 296 424 C 288 432, 286 436, 310 437 C 326 437, 322 432, 318 424 Z" fill="#3D5A73" opacity="0.5"/>
    <ellipse cx="308" cy="430" rx="12" ry="4" fill="#52738D" opacity="0.6"/>
  </g>

  <!-- ================================================================= -->
  <!-- 4. HERO SOLDY VOLUMETRIC SOLDER BODY                              -->
  <!-- ================================================================= -->
  <!-- Core 3D Body -->
  <path d="M 256 80 C 148 218, 104 278, 104 348 C 104 430, 172 452, 256 452 C 340 452, 408 430, 408 348 C 408 278, 364 218, 256 80 Z" fill="url(#body3D)" filter="url(#mascotVolumetricShadow)"/>

  <!-- Bottom Rim Light (Soft Sky ground bounce) -->
  <path d="M 104 348 C 104 430, 172 452, 256 452 C 340 452, 408 430, 408 348 C 390 420, 330 442, 256 442 C 182 442, 122 420, 104 348 Z" fill="url(#rimLightGrad)"/>

  <!-- Left Surface Tension Meniscus Highlight Curve -->
  <path d="M 256 106 C 182 218, 144 276, 140 342 C 138 276, 178 212, 256 106 Z" fill="url(#specularSheen)"/>

  <!-- Top Tip Precision Specular Pin Glint -->
  <ellipse cx="256" cy="115" rx="8" ry="14" fill="#FFFFFF" opacity="0.65" transform="rotate(-15 256 115)"/>
  <circle cx="254" cy="110" r="3.5" fill="#FFFFFF"/>

  <!-- Secondary Soft Glow on Belly -->
  <ellipse cx="225" cy="365" rx="55" ry="35" fill="#FFFFFF" opacity="0.08"/>

  <!-- ================================================================= -->
  <!-- 5. 3D SAFETY GOGGLES WITH GLASS REFRACTION                        -->
  <!-- ================================================================= -->
  <g id="safety_goggles_3d">
    <!-- Goggle Shadow Cast onto Forehead -->
    <path d="M 148 200 C 190 180, 322 180, 364 200" fill="none" stroke="#1E2F3E" stroke-width="16" stroke-linecap="round" opacity="0.35"/>

    <!-- Thick Rubber Strap Wrapping Around Head -->
    <path d="M 146 190 C 190 168, 322 168, 366 190" fill="none" stroke="#243746" stroke-width="14" stroke-linecap="round"/>
    <path d="M 146 189 C 190 169, 322 169, 366 189" fill="none" stroke="#4A657D" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Left Goggle Beveled Frame -->
    <rect x="178" y="160" width="70" height="52" rx="18" fill="url(#goggleFrameGrad)" stroke="#1A2834" stroke-width="3"/>
    <rect x="180" y="162" width="66" height="48" rx="16" fill="none" stroke="#5C7A96" stroke-width="1.8" opacity="0.7"/>
    <!-- Left Glass Lens -->
    <rect x="183" y="165" width="60" height="42" rx="13" fill="url(#lensGrad)"/>
    <!-- Left Lens Diagonal Gloss Gleams -->
    <path d="M 190 195 L 210 168 L 222 168 L 202 195 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M 226 188 L 234 176 L 238 176 L 230 188 Z" fill="#FFFFFF" opacity="0.5"/>

    <!-- Right Goggle Beveled Frame -->
    <rect x="264" y="160" width="70" height="52" rx="18" fill="url(#goggleFrameGrad)" stroke="#1A2834" stroke-width="3"/>
    <rect x="266" y="162" width="66" height="48" rx="16" fill="none" stroke="#5C7A96" stroke-width="1.8" opacity="0.7"/>
    <!-- Right Glass Lens -->
    <rect x="269" y="165" width="60" height="42" rx="13" fill="url(#lensGrad)"/>
    <!-- Right Lens Diagonal Gloss Gleams -->
    <path d="M 276 195 L 296 168 L 308 168 L 288 195 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M 312 188 L 320 176 L 324 176 L 316 188 Z" fill="#FFFFFF" opacity="0.5"/>

    <!-- Heavy Duty Goggle Bridge -->
    <rect x="244" y="176" width="24" height="12" rx="4" fill="#243746" stroke="#1A2834" stroke-width="2"/>
    <rect x="246" y="178" width="20" height="4" rx="2" fill="#5C7A96" opacity="0.8"/>
  </g>

  <!-- ================================================================= -->
  <!-- 6. HIGH-CRAFT KAWAII FACIAL FEATURES                              -->
  <!-- ================================================================= -->
  <!-- Left Eye with Depth -->
  <g id="left_eye">
    <!-- Eye socket subtle ambient shadow -->
    <ellipse cx="214" cy="296" rx="16" ry="26" fill="#1E2F3E" opacity="0.15"/>
    <!-- Deep glossy pupil -->
    <ellipse cx="214" cy="294" rx="14" ry="24" fill="#182733"/>
    <!-- Primary Big Specular Sparkle -->
    <circle cx="209" cy="284" r="7.5" fill="#FFFFFF"/>
    <!-- Secondary Bottom Light Catcher -->
    <circle cx="218" cy="305" r="3.5" fill="#FFFFFF"/>
    <!-- Tertiary tiny glint -->
    <circle cx="212" cy="308" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Right Eye with Depth -->
  <g id="right_eye">
    <ellipse cx="298" cy="296" rx="16" ry="26" fill="#1E2F3E" opacity="0.15"/>
    <ellipse cx="298" cy="294" rx="14" ry="24" fill="#182733"/>
    <circle cx="293" cy="284" r="7.5" fill="#FFFFFF"/>
    <circle cx="302" cy="305" r="3.5" fill="#FFFFFF"/>
    <circle cx="296" cy="308" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Soft Rosy Technician Cheeks (Airbrush Gradient Effect) -->
  <ellipse cx="182" cy="325" rx="18" ry="11" fill="#E8A598" opacity="0.65"/>
  <circle cx="180" cy="324" r="5" fill="#FFFFFF" opacity="0.25"/>
  
  <ellipse cx="330" cy="325" rx="18" ry="11" fill="#E8A598" opacity="0.65"/>
  <circle cx="328" cy="324" r="5" fill="#FFFFFF" opacity="0.25"/>

  <!-- Sweet Confident Smile with Lip Depth -->
  <path d="M 238 325 Q 256 347 274 325" fill="none" stroke="#182733" stroke-width="7" stroke-linecap="round"/>
  <path d="M 242 327 Q 256 345 270 327" fill="none" stroke="#3D5A73" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- ================================================================= -->
  <!-- 7. SOLDER SPOOL ON LEFT HIP                                       -->
  <!-- ================================================================= -->
  <g id="solder_spool_3d" transform="translate(106, 354)">
    <rect x="0" y="0" width="30" height="42" rx="7" fill="#243746" stroke="#182733" stroke-width="2"/>
    <rect x="4" y="6" width="22" height="30" rx="4" fill="#CBE2F4"/>
    <!-- Wire Coils with Metallic Glints -->
    <line x1="4" y1="11" x2="26" y2="11" stroke="#52738D" stroke-width="3"/>
    <line x1="6" y1="11" x2="16" y2="11" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <line x1="4" y1="17" x2="26" y2="17" stroke="#52738D" stroke-width="3"/>
    <line x1="6" y1="17" x2="16" y2="17" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <line x1="4" y1="23" x2="26" y2="23" stroke="#52738D" stroke-width="3"/>
    <line x1="6" y1="23" x2="16" y2="23" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <line x1="4" y1="29" x2="26" y2="29" stroke="#52738D" stroke-width="3"/>
    <line x1="6" y1="29" x2="16" y2="29" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    <!-- Flexible Solder Lead extending outward -->
    <path d="M 26 14 C 45 6, 62 22, 76 18" fill="none" stroke="#CBE2F4" stroke-width="5" stroke-linecap="round"/>
    <path d="M 26 14 C 45 6, 62 22, 76 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Left Arm Guiding Wire with Volumetric Depth -->
  <path d="M 126 318 C 106 338, 136 374, 172 370" fill="none" stroke="#243746" stroke-width="16" stroke-linecap="round"/>
  <path d="M 128 317 C 109 336, 136 371, 170 368" fill="none" stroke="#4A657D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="174" cy="370" r="10" fill="#243746"/>

  <!-- Right Arm Holding Soldering Iron -->
  <path d="M 378 320 C 404 336, 420 372, 384 398" fill="none" stroke="#243746" stroke-width="16" stroke-linecap="round"/>
  <path d="M 380 320 C 403 334, 417 369, 383 395" fill="none" stroke="#4A657D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="382" cy="400" r="11" fill="#243746"/>

  <!-- ================================================================= -->
  <!-- 8. HIGH-PRECISION SOLDERING IRON TOOL WITH SATIN METALLIC BARREL  -->
  <!-- ================================================================= -->
  <g id="soldering_iron_3d" transform="translate(365, 302) rotate(32)">
    <!-- Heated Tip Aura Halo -->
    <circle cx="0" cy="172" r="34" fill="url(#tipPulsingGlow)"/>

    <!-- Ergonomic Ribbed Handle -->
    <rect x="-14" y="0" width="28" height="94" rx="11" fill="url(#goggleFrameGrad)" stroke="#182733" stroke-width="2"/>
    <!-- Ergonomic Soft Sky Grip Rings with Depth -->
    <rect x="-16" y="18" width="32" height="12" rx="4" fill="#CBE2F4" stroke="#52738D" stroke-width="1"/>
    <line x1="-14" y1="21" x2="14" y2="21" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    
    <rect x="-16" y="52" width="32" height="12" rx="4" fill="#CBE2F4" stroke="#52738D" stroke-width="1"/>
    <line x1="-14" y1="55" x2="14" y2="55" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

    <!-- Stainless Steel Barrel with Cylindrical Reflection -->
    <rect x="-8" y="94" width="16" height="50" rx="3" fill="url(#metalShaftGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Precision Ceramic/Silver Solder Tip -->
    <polygon points="0,172 -10,140 10,140" fill="url(#metalShaftGrad)" stroke="#52738D" stroke-width="1.5"/>
    <polygon points="0,172 -6,144 6,144" fill="#CBE2F4" opacity="0.9"/>
    
    <!-- White Hot Solder Glint Pin Point -->
    <circle cx="0" cy="170" r="4.5" fill="#FFFFFF"/>
    <circle cx="0" cy="170" r="8" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- ================================================================= -->
  <!-- 9. TACTILE FLOATING SPARKLES (✦) & MICRO SOLDER BEADS             -->
  <!-- ================================================================= -->
  <!-- Tiny Floating Micro Solder Beads (Playful Liquid Character) -->
  <circle cx="395" cy="220" r="6" fill="url(#body3D)" filter="url(#mascotVolumetricShadow)"/>
  <circle cx="393" cy="218" r="2" fill="#FFFFFF" opacity="0.8"/>
  
  <circle cx="95" cy="290" r="4.5" fill="url(#body3D)" filter="url(#mascotVolumetricShadow)"/>
  <circle cx="93" cy="288" r="1.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Stardust Sparkles with Center Glints -->
  <!-- Tip Big Sparkle -->
  <g transform="translate(426, 400)">
    <path d="M 0 16 Q 0 0 16 0 Q 0 0 0 -16 Q 0 0 -16 0 Q 0 0 0 16 Z" fill="#CBE2F4"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Top Right Sparkle -->
  <g transform="translate(372, 115) scale(0.75)">
    <path d="M 0 16 Q 0 0 16 0 Q 0 0 0 -16 Q 0 0 -16 0 Q 0 0 0 16 Z" fill="#CBE2F4"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Mid Left Sparkle -->
  <g transform="translate(78, 220) scale(0.65)">
    <path d="M 0 16 Q 0 0 16 0 Q 0 0 0 -16 Q 0 0 -16 0 Q 0 0 0 16 Z" fill="#CBE2F4"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
